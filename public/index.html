<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de Agendamentos</title>
<style>
  :root {
    --rosa: #d6336c;
    --rosa-claro: #fff0f5;
    --cinza: #6c757d;
    --borda: #eee;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--rosa-claro);
    margin: 0;
    padding: 16px;
    color: #222;
  }
  h1 {
    font-size: 1.4rem;
    color: var(--rosa);
    margin: 0 0 4px;
  }
  .subtitulo { color: var(--cinza); font-size: 0.9rem; margin-bottom: 16px; }
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  input[type="date"], button {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    font-size: 0.9rem;
  }
  button {
    background: var(--rosa);
    color: white;
    border: none;
    cursor: pointer;
  }
  button.secundario {
    background: white;
    color: var(--rosa);
    border: 1px solid var(--rosa);
  }
  .cards { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: white;
    border-radius: 12px;
    padding: 12px 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .card.cancelado { opacity: 0.5; }
  .info b { color: var(--rosa); }
  .info .linha { font-size: 0.85rem; color: #333; margin-top: 2px; }
  .status {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: #e6f7ee;
    color: #1a7a4c;
    white-space: nowrap;
  }
  .status.cancelado { background: #fdeaea; color: #a12626; }
  .btn-cancelar {
    background: white;
    color: #a12626;
    border: 1px solid #a12626;
    font-size: 0.8rem;
    padding: 6px 10px;
  }
  .vazio { text-align: center; color: var(--cinza); padding: 40px 0; }
</style>
</head>
<body>
  <h1>💅 Painel de Agendamentos</h1>
  <div class="subtitulo">Dados ao vivo, direto do banco do bot</div>

  <div class="toolbar">
    <input type="date" id="filtroData" />
    <button class="secundario" id="limparFiltro">Limpar filtro</button>
    <button id="atualizar">Atualizar agora</button>
  </div>

  <div class="cards" id="lista"></div>
  <div class="vazio" id="vazio" style="display:none">Nenhum agendamento encontrado.</div>

<script>
  const lista = document.getElementById("lista");
  const vazio = document.getElementById("vazio");
  const filtroData = document.getElementById("filtroData");

  function formatarDataBR(iso) {
    const [ano, mes, dia] = iso.split("-");
    return `${dia}/${mes}/${ano}`;
  }

  async function carregar() {
    const resp = await fetch("/api/agendamentos");
    if (!resp.ok) {
      lista.innerHTML = "";
      vazio.style.display = "block";
      vazio.textContent = "Não foi possível carregar os agendamentos.";
      return;
    }
    let dados = await resp.json();

    if (filtroData.value) {
      dados = dados.filter((a) => a.data === filtroData.value);
    }

    lista.innerHTML = "";
    if (dados.length === 0) {
      vazio.style.display = "block";
      vazio.textContent = "Nenhum agendamento encontrado.";
      return;
    }
    vazio.style.display = "none";

    dados.forEach((a) => {
      const card = document.createElement("div");
      card.className = "card" + (a.status === "cancelado" ? " cancelado" : "");
      card.innerHTML = `
        <div class="info">
          <b>${a.nome_cliente || "Sem nome"}</b>
          <div class="linha">${a.servico}</div>
          <div class="linha">📅 ${formatarDataBR(a.data)} às ${a.horario}</div>
          <div class="linha">📱 ${a.telefone.replace("@c.us", "")}</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
          <span class="status ${a.status}">${a.status}</span>
          ${
            a.status === "confirmado"
              ? `<button class="btn-cancelar" data-id="${a.id}">Cancelar</button>`
              : ""
          }
        </div>
      `;
      lista.appendChild(card);
    });

    document.querySelectorAll(".btn-cancelar").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Cancelar este agendamento?")) return;
        await fetch(`/api/agendamentos/${btn.dataset.id}/cancelar`, {
          method: "POST",
        });
        carregar();
      });
    });
  }

  document.getElementById("atualizar").addEventListener("click", carregar);
  document.getElementById("limparFiltro").addEventListener("click", () => {
    filtroData.value = "";
    carregar();
  });
  filtroData.addEventListener("change", carregar);

  carregar();
  setInterval(carregar, 30000); // atualiza sozinho a cada 30s
</script>
</body>
</html>
